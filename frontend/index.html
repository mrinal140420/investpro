<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InvestPro — Investment Planner</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme init: runs before first paint to avoid flash -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('theme');
          var dark = !s ? window.matchMedia('(prefers-color-scheme: dark)').matches : s === 'dark';
          if (!dark) document.documentElement.classList.add('light');
        } catch (_) {}
      })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: false,
        theme: {
          extend: {
            colors: {
              'surface':    'var(--surface)',
              'surface-2':  'var(--surface-2)',
              'surface-3':  'var(--surface-3)',
              'border-c':   'var(--border)',
              'accent':     'var(--accent)',
              'success':    'var(--success)',
              'warning':    'var(--warning)',
              'danger':     'var(--danger)',
              'text-1':     'var(--text-1)',
              'text-2':     'var(--text-2)',
              'text-3':     'var(--text-3)',
            },
            fontFamily: {
              sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
