<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InvestPro — Digital Family Office</title>
    <link rel="icon" type="image/png" href="/LOGO.png" />

    <!-- Google Fonts: Outfit, JetBrains Mono, Cinzel for luxury serif accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme init: runs before first paint to avoid flash -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('theme');
          var dark = !s ? window.matchMedia('(prefers-color-scheme: dark)').matches : s === 'dark';
          if (!dark) document.documentElement.classList.add('light');
        } catch (_) {}
      })();
    </script>


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
